function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4800);}
function log(text){data.activity.unshift({text,type:'Changed in this demo'});data.activity=data.activity.slice(0,8);}
function go(destination,focus=true){page=NAV[role].some(n=>n[0]===destination)?destination:'dashboard';render();if(focus)$('main').querySelector('h1')?.focus();}
function switchRole(next){if(!NAV[next]||role===next)return;closeModal();role=next;filters={rosterSearch:'',rosterStatus:'',eventStatus:'',eventCategory:''};go('dashboard');toast(next==='executive'?'Executive board view · Casey Linden':'Member view · Alex Rowan');}
function render(){
 document.querySelectorAll('[data-action="role"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));
 const person=isExec()?data.members.find(m=>m.id==='m4'):mine();
 $('identity').innerHTML=`<span class="avatar" aria-hidden="true">${esc(initials(person.name))}</span><div><b>${esc(person.name)}</b><small>${isExec()?'Chapter president':'Student member'}</small></div>`;
 $('nav-label').textContent=isExec()?'Chapter workspace':'Member space';
 $('nav').innerHTML=NAV[role].map(([id,symbol,label])=>`<button type="button" class="nav-item" data-action="nav" data-id="${id}"${id===page?' aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${symbol}</span>${label}</button>`).join('');
 const views={dashboard:isExec()?executiveDashboard:memberDashboard,events:eventsPage,announcements:announcementsPage,resources:resourcesPage,profile:profilePage,roster:rosterPage};
 $('main').innerHTML=(views[page]||memberDashboard)()+`<footer class="footer"><span>SVA Connect · Northstar Campus concept · Fictional data only</span><span>Interactive prototype · No account required</span></footer>`;
}
function dateTile(e){return `<div class="date-tile"><span>${esc(dateObj(e.date).toLocaleDateString('en-US',{month:'short'}).toUpperCase())}</span><strong>${dateObj(e.date).getDate()}</strong></div>`;}
function rsvpButton(e,small=false){const going=e.rsvps.includes('m1');return `<button type="button" class="btn ${going?'':'primary'} ${small?'small':''}" data-action="rsvp" data-id="${esc(e.id)}" aria-pressed="${going}" aria-label="${going?'Cancel RSVP for':'RSVP to'} ${esc(e.title)}">${going?'Going ✓ · Cancel RSVP':'RSVP · I’m going'}</button>`;}
function eventRow(e){return `<div class="event-row">${dateTile(e)}<div class="event-info"><h3>${esc(e.title)}</h3><div class="meta">${esc(timeLabel(e.time))} · ${esc(e.location)}</div><div class="item-actions">${rsvpButton(e,true)}</div></div></div>`;}
function announcementCard(a,executive=false){return `<article class="announcement"><div>${executive?badge(a.status):`<span class="badge gray">${esc(a.category)}</span>`}</div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="meta">${esc(longDate(a.date))} · Executive board</div>${executive?`<div class="item-actions">${btn('Edit','edit-announcement',a.id,'small')}${a.status==='Draft'?btn('Publish','publish-announcement',a.id,'small primary'):''}</div>`:''}</article>`;}
function memberDashboard(){
 const m=mine(),events=visibleEvents(),going=events.filter(e=>e.rsvps.includes('m1')),ann=visibleAnnouncements();
 return heading('Member dashboard','Good to see you, '+m.name.split(' ')[0]+'.','A place to connect, find support, and shape what comes next.')+
 `<div class="hero"><div><div class="eyebrow">Your next chapter starts together</div><h2>Find your people.<br>Make your mark.</h2><p>From a quick coffee to a shared purpose, there’s a place for you in this chapter.</p>${btn('Explore chapter events →','nav','events')}</div><div class="hero-art" aria-hidden="true"><span>✦</span></div></div>`+
 stats([['Your RSVPs',going.length,'Events you’re planning to join'],['Chapter events',events.length,'Published in this demo'],['Chapter updates',ann.length,'From your executive board']])+
 `<div class="grid"><section class="card"><div class="card-title"><h2>On the horizon</h2>${btn('All events →','nav','events','quiet small')}</div>${events.slice(0,2).map(eventRow).join('')||empty('More to come','Published chapter events will appear here.')}</section><section class="card"><div class="card-title"><h2>Chapter bulletin</h2>${btn('All updates →','nav','announcements','quiet small')}</div>${ann.slice(0,1).map(a=>announcementCard(a)).join('')||empty('You’re all caught up','Chapter updates will appear here.')}<div class="spotlight"><h3>Support for the next step.</h3><p>Explore campus resource categories for academics, careers, and community.</p>${btn('Find resources →','nav','resources','small')}</div></section></div>`;
}
function executiveDashboard(){
 const active=data.members.filter(m=>m.status==='Active').length,pending=data.members.filter(m=>m.status==='Pending').length;
 const ev=visibleEvents(),drafts=data.events.filter(e=>e.status==='Draft').length;
 const total=ev.reduce((n,e)=>n+e.rsvps.length,0);
 return heading('Executive board workspace','A clear view of your chapter.','Keep your community connected, your calendar current, and your next steps in view.',btn('+ Create event','new-event','','primary'))+
 stats([['Chapter members',data.members.length,active+' active · '+pending+' pending'],['Published events',ev.length,drafts+' draft'+(drafts===1?'':'s')+' awaiting publication'],['Event RSVPs',total,'Intent to attend · no attendance tracking']])+
 `<div class="grid"><section class="card"><div class="card-title"><div><h2>Chapter pulse</h2><p class="card-subtitle">Membership across military branches</p></div>${badge('Fictional')}</div>${BRANCHES.filter(branch=>data.members.some(m=>m.branch===branch)).map(branch=>{const count=data.members.filter(m=>m.branch===branch).length;return `<div class="progress"><label>${esc(branch)}</label><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,count/data.members.length*100)}%"></div></div><span>${count}</span></div>`;}).join('')}<div class="spotlight"><h3>${pending?pending+' member'+(pending===1?' is':'s are')+' awaiting review.':'Membership review is up to date.'}</h3><p>Review fictional member details and update chapter status.</p>${btn('Open member roster →','nav','roster','small')}</div></section><section class="card"><div class="card-title"><h2>Next on the calendar</h2>${btn('Manage →','nav','events','quiet small')}</div>${ev.slice(0,3).map(e=>`<div class="event-row">${dateTile(e)}<div class="event-info"><h3>${esc(e.title)}</h3><div class="meta">${e.rsvps.length} RSVP${e.rsvps.length===1?'':'s'} · ${esc(e.location)}</div><div class="item-actions">${btn('Edit event','edit-event',e.id,'small')}</div></div></div>`).join('')||empty('Plan your next gathering','Create and publish an event to get started.')}</section></div>`+
 `<div class="grid"><section class="card"><div class="card-title"><h2>Chapter communications</h2>${btn('+ Write update','new-announcement','','small primary')}</div>${data.announcements.filter(a=>a.status==='Draft').slice(0,1).map(a=>announcementCard(a,true)).join('')||`<p class="small-copy">No drafts waiting. Share a new update with the chapter.</p>`}</section><section class="card"><div class="card-title"><h2>Recent activity</h2>${badge('This session')}</div>${data.activity.slice(0,4).map(a=>`<div class="activity-item"><i aria-hidden="true"></i><div><p>${esc(a.text)}</p><small>${esc(a.type)}</small></div></div>`).join('')}</section></div>`;
}
function eventsPage(){return heading(isExec()?'Chapter calendar':'Get involved',isExec()?'Make room for connection.':'Your next connection is here.',isExec()?'Create, edit, and publish chapter gatherings. Drafts stay in this executive view.':'Find a gathering that fits. Your RSVP will also appear in the executive board’s totals.',isExec()?btn('+ Create event','new-event','','primary'):'')+
 `<div class="toolbar"><label class="sr-only" for="event-filter">${isExec()?'Event publication status':'Event category'}</label><select id="event-filter" data-filter="event"><option value="">${isExec()?'All event statuses':'All categories'}</option>${(isExec()?['Published','Draft']:['Community','Career','Chapter','Service']).map(v=>`<option${(isExec()?filters.eventStatus:filters.eventCategory)===v?' selected':''}>${esc(v)}</option>`).join('')}</select><span class="small-copy" id="event-count" aria-live="polite">${filteredEvents().length} event${filteredEvents().length===1?'':'s'}</span></div><div class="event-cards" id="event-list">${eventList()}</div>`;}
function filteredEvents(){return (isExec()?data.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)):visibleEvents()).filter(e=>isExec()?(!filters.eventStatus||e.status===filters.eventStatus):(!filters.eventCategory||e.category===filters.eventCategory));}
function eventList(){const list=filteredEvents();return list.length?list.map(e=>`<article class="event-card"><div class="event-top">${dateTile(e)}<div>${isExec()?badge(e.status):`<span class="badge gray">${esc(e.category)}</span>`}<div class="meta">${esc(longDate(e.date))}</div></div></div><div class="event-copy"><h2>${esc(e.title)}</h2><div class="meta">${esc(timeLabel(e.time))} · ${esc(e.location)}</div><p>${esc(e.description)}</p><span class="small-copy">${e.rsvps.length} fictional member${e.rsvps.length===1?'':'s'} planning to join</span></div><div class="item-actions">${isExec()?btn('Edit event','edit-event',e.id)+ (e.status==='Draft'?btn('Publish event','publish-event',e.id,'primary'):''):rsvpButton(e)}</div></article>`).join(''):empty('No events in this view','Choose another filter to explore the chapter calendar.');}
function announcementsPage(){return heading(isExec()?'Chapter communications':'Stay connected',isExec()?'Keep the chapter in the loop.':'From your executive board.',isExec()?'Write an update, save a draft, or publish it for members to see.':'The latest published news from your fictional chapter.',isExec()?btn('+ Write announcement','new-announcement','','primary'):'')+
 `<div class="card">${(isExec()?data.announcements.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.order||0)-(a.order||0)):visibleAnnouncements()).map(a=>announcementCard(a,isExec())).join('')||empty('No published updates yet','New chapter announcements will appear here.')}</div>`;}
function filteredMembers(){const q=filters.rosterSearch.trim().toLowerCase();return data.members.filter(m=>(!filters.rosterStatus||m.status===filters.rosterStatus)&&(!q||[m.name,m.branch,m.major,m.role].some(v=>v.toLowerCase().includes(q))));}
function rosterRows(){const list=filteredMembers();return list.length?list.map(m=>`<tr><td><div class="name">${esc(m.name)}</div><div class="sub">${esc(m.role)}</div></td><td>${esc(m.branch)}</td><td>${esc(m.major)}</td><td>${badge(m.status)}</td><td>${btn('Edit','edit-member',m.id,'small')}</td></tr>`).join(''):`<tr><td colspan="5">${empty('No matching members','Try a different search or status filter.')}</td></tr>`;}
function rosterPage(){if(!isExec())return memberDashboard();return heading('Member management','People make the chapter.', 'Review chapter membership and keep fictional member details current.',btn('+ Add fictional member','new-member','','primary'))+
 `<div class="notice"><b>Presentation data only.</b> All records are invented. Please use fictional details when trying the forms.</div><div class="card"><div class="card-title"><h2>Chapter roster</h2>${btn('Export filtered CSV','export','','small')}</div><div class="toolbar"><label class="sr-only" for="roster-search">Search roster</label><input id="roster-search" data-filter="roster-search" type="search" placeholder="Search names, branches, or academic focus" value="${esc(filters.rosterSearch)}"><label class="sr-only" for="roster-status">Filter member status</label><select id="roster-status" data-filter="roster-status"><option value="">All statuses</option>${['Active','Pending','Paused'].map(v=>`<option${filters.rosterStatus===v?' selected':''}>${v}</option>`).join('')}</select></div><p class="small-copy" id="roster-count" aria-live="polite">${filteredMembers().length} of ${data.members.length} fictional members</p><div class="table-wrap"><table><thead><tr><th scope="col">Member</th><th scope="col">Military branch</th><th scope="col">Academic focus</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="roster-rows">${rosterRows()}</tbody></table></div></div>`;}
function resourcesPage(){const resources=[['◇','Veteran services','Find the campus team that helps student veterans navigate university life.',['Questions about campus services','Connections to the appropriate staff','Guidance on where to start']],['▤','Academic advising','Build a path through your academic goals with the right support.',['Course and degree planning','Tutoring and study support','Conversations about your next semester']],['↗','Career development','Connect your experience with the opportunities ahead.',['Resume and interview practice','Translating military experience','Exploring career pathways']],['◌','Peer community','Sometimes the next step starts with a conversation.',['Informal chapter gatherings','Peer mentorship opportunities','Shared interests and service projects']]];return heading('Campus connections','Support for every next step.','A preview of how members could find campus support in one place.')+`<div class="notice">These are sample resource categories. A future chapter site would include verified campus contacts and links.</div><div class="resource-grid">${resources.map(([icon,title,description,bullets])=>`<article class="card resource-card"><div class="resource-icon" aria-hidden="true">${icon}</div><h2>${title}</h2><p>${description}</p><ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>${title==='Peer community'?btn('Explore chapter events →','nav','events','small'):''}</article>`).join('')}</div>`;}
function profilePage(){const m=mine();return heading('Your member space','A little more about you.','Your fictional profile connects your interests with your chapter.',btn('Edit demo profile','edit-profile','','primary'))+
 `<section class="card"><div class="profile-banner"><div class="avatar" aria-hidden="true">${esc(initials(m.name))}</div><div><h2>${esc(m.name)}</h2><p>${esc(m.role)} · Northstar Campus</p>${badge(m.status)}</div></div><dl class="details"><div><dt>Military branch</dt><dd>${esc(m.branch)}</dd></div><div><dt>Academic focus</dt><dd>${esc(m.major)}</dd></div><div><dt>Academic year</dt><dd>${esc(m.year)}</dd></div><div><dt>Interests</dt><dd>${esc(m.interests)||'Add an interest in your profile.'}</dd></div><div class="wide"><dt>About you</dt><dd>${esc(m.bio)||'Tell your chapter a little about yourself.'}</dd></div></dl></section><p class="small-copy">Profile edits update this fictional member’s record in the executive view during this tab’s session.</p>`;}
function options(values,current){return values.map(v=>`<option value="${esc(v)}"${v===current?' selected':''}>${esc(v)}</option>`).join('');}
function field(label,name,value='',type='text',max=100,extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" required${['text'].includes(type)?` maxlength="${max}"`:''} ${extra}></div>`;}
function selectField(label,name,values,current){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" required>${options(values,current)}</select></div>`;}
function textarea(label,name,value,max=600){return `<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" maxlength="${max}" required>${esc(value)}</textarea></div>`;}
function showModal(title,subtitle,body,type='',id=''){
 if($('modal').open)closeModal();modalType=type;modalId=id;
 $('modal').innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button type="button" class="close" data-action="close-modal" aria-label="Close dialog">×</button></div><div class="dialog-body">${body}</div>`;
 $('modal').showModal();
 const first=$('modal').querySelector('input,textarea,select');if(first)first.focus();
}
function closeModal(){if($('modal').open)$('modal').close();modalType='';modalId='';}
function formShell(body,submit='Save changes'){return `<form id="editor-form"><p class="error" id="form-error" role="alert" hidden></p>${body}<div class="dialog-actions">${btn('Cancel','close-modal')}<button type="submit" class="btn primary">${submit}</button></div></form>`;}
function openMember(id=''){
 if(!isExec())return;const m=data.members.find(x=>x.id===id)||{name:'',branch:'Army',major:'',year:'First year',role:'Member',status:'Pending'};
 const body=field('Fictional member name','name',m.name,'text',60)+`<div class="form-row">${selectField('Military branch','branch',BRANCHES,m.branch)}${selectField('Chapter status','status',['Active','Pending','Paused'],m.status)}</div>`+field('Academic focus','major',m.major,'text',80)+`<div class="form-row">${selectField('Academic year','year',YEARS,m.year)}${selectField('Chapter role','role',['Member','Peer mentor','Events volunteer','Chapter president','Vice president','Secretary','Treasurer'],m.role)}</div>`;
 showModal(id?'Edit fictional member':'Add a fictional member','Use invented details only. No contact information or student IDs are collected.',formShell(body,id?'Save member':'Add fictional member'),'member',id);
}
function openEvent(id=''){
 if(!isExec())return;const e=data.events.find(x=>x.id===id)||{title:'',date:'2026-11-26',time:'15:00',location:'',category:'Community',description:'',status:'Draft'};
 const body=field('Event title','title',e.title,'text',90)+`<div class="form-row">${field('Date','date',e.date,'date',0,'min="2026-01-01" max="2035-12-31"')}${field('Time · campus local time','time',e.time,'time')}</div>`+field('Location','location',e.location,'text',100)+`<div class="form-row">${selectField('Category','category',['Community','Career','Chapter','Service'],e.category)}${selectField('Visibility','status',['Draft','Published'],e.status)}</div>`+textarea('Event description','description',e.description)+`<p class="small-copy">Published events appear in Member view immediately. Existing RSVPs stay attached when you edit an event.</p>`;
 showModal(id?'Edit chapter event':'Create a chapter event','Plan a gathering, then choose whether to save a draft or publish.',formShell(body,id?'Save event':'Create event'),'event',id);
}
function openAnnouncement(id=''){
 if(!isExec())return;const a=data.announcements.find(x=>x.id===id)||{title:'',body:'',category:'Chapter update',status:'Draft'};
 const body=field('Announcement title','title',a.title,'text',100)+textarea('Message','body',a.body,1200)+`<div class="form-row">${selectField('Category','category',['Chapter update','Community','Opportunity'],a.category)}${selectField('Visibility','status',['Draft','Published'],a.status)}</div>`+`<p class="small-copy">Publishing updates the member bulletin in this tab. No email or notification is sent.</p>`;
 showModal(id?'Edit announcement':'Write an announcement','Share a fictional chapter update with the member side of this demo.',formShell(body,id?'Save announcement':'Save announcement'),'announcement',id);
}
function openProfile(){if(isExec())return;const m=mine();const body=field('Academic focus','major',m.major,'text',80)+selectField('Academic year','year',YEARS,m.year)+field('Interests','interests',m.interests,'text',160)+textarea('Short introduction','bio',m.bio,400);showModal('Edit your demo profile','You’re editing '+m.name+'’s fictional record.',formShell(body),'profile','m1');}
function guide(){showModal('A five-minute chapter walkthrough','Two perspectives. One shared fictional chapter.',`<ol class="guide-list"><li><strong>Start with the Member dashboard.</strong>Explore the chapter bulletin, open Events, and RSVP to Coffee & community.</li><li><strong>Visit Resources and My profile.</strong>Show the member support categories and edit Alex’s academic focus.</li><li><strong>Switch to Executive board.</strong>See the RSVP totals, open Member roster, and review a Pending member.</li><li><strong>Publish something new.</strong>Create a draft event, then publish it. Write and publish an announcement.</li><li><strong>Return to Member view.</strong>The published event and announcement now appear. Drafts stay in the executive view.</li></ol><div class="notice"><b>Presenter controls:</b> Use Reset demo before a new run. Reloading also restores the original scenario.</div><p class="small-copy">All data is fictional. The view switch simulates roles; it is not an account or security system. Everything works in this browser tab without a server, email, or database. RSVPs represent plans to attend; there is no attendance check-in or RFID functionality.</p><div class="dialog-actions">${btn('Start walkthrough','start-tour','','primary')}</div>`,'guide');}
function resetConfirm(){showModal('Reset this demo?','Restore the original fictional scenario.',`<p class="small-copy">This clears profile edits, roster edits, new events, announcements, RSVPs you changed, and filters. You’ll return to the Member dashboard.</p><div class="dialog-actions">${btn('Keep exploring','close-modal')}${btn('Reset demo','reset','','primary')}</div>`,'reset');}
function exportRoster(){if(!isExec())return;const quote=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=[['Fictional name','Branch','Academic focus','Year','Chapter role','Status'],...filteredMembers().map(m=>[m.name,m.branch,m.major,m.year,m.role,m.status])];const safe=v=>/^[=+\-@\t\r\n]/.test(String(v))?"'"+v:v;const csv=rows.map(r=>r.map(v=>quote(safe(v))).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='SVA-Connect-Fictional-Roster.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Exported '+(rows.length-1)+' fictional member records.');}
function handleAction(action,id,el){
 const privileged=['new-member','edit-member','new-event','edit-event','publish-event','new-announcement','edit-announcement','publish-announcement','export'];
 if(privileged.includes(action)&&!isExec()){toast('Switch to Executive board to use this demo control.');return;}
 switch(action){
 case 'nav':go(id);break;
 case 'home':go('dashboard');break;
 case 'role':switchRole(el.dataset.role);break;
 case 'guide':guide();break;
 case 'close-modal':closeModal();break;
 case 'start-tour':closeModal();role='member';go('dashboard');break;
 case 'reset-confirm':resetConfirm();break;
 case 'reset':closeModal();data=structuredClone(SEED);nextRecord=100;role='member';filters={rosterSearch:'',rosterStatus:'',eventStatus:'',eventCategory:''};go('dashboard');toast('Demo restored. You’re ready for a fresh walkthrough.');break;
 case 'rsvp':{if(isExec())return;const e=data.events.find(e=>e.id===id&&e.status==='Published');if(!e)return;const wasGoing=e.rsvps.includes('m1');e.rsvps=wasGoing?e.rsvps.filter(x=>x!=='m1'):[...new Set([...e.rsvps,'m1'])];log(mine().name+(wasGoing?' cancelled an RSVP for ':' RSVP’d to ')+e.title+'.');render();document.querySelector(`[data-action="rsvp"][data-id="${id}"]`)?.focus();toast(wasGoing?'RSVP cancelled in this demo.':'You’re on the list · Demo RSVP saved.');break;}
 case 'new-member':openMember();break;
 case 'edit-member':openMember(id);break;
 case 'new-event':openEvent();break;
 case 'edit-event':openEvent(id);break;
 case 'new-announcement':openAnnouncement();break;
 case 'edit-announcement':openAnnouncement(id);break;
 case 'edit-profile':openProfile();break;
 case 'publish-event':{const e=data.events.find(e=>e.id===id);if(!e)return;e.status='Published';log('Published event: '+e.title+'.');render();$('main').querySelector('h1')?.focus();toast('Event published. Switch to Member view to see it.');break;}
 case 'publish-announcement':{const a=data.announcements.find(a=>a.id===id);if(!a)return;a.status='Published';a.date='2026-10-26';a.order=Date.now();log('Published announcement: '+a.title+'.');render();$('main').querySelector('h1')?.focus();toast('Announcement published to the member bulletin.');break;}
 case 'export':exportRoster();break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();handleAction(el.dataset.action,el.dataset.id||'',el);});
document.addEventListener('input',e=>{if(e.target.dataset.filter==='roster-search'&&isExec()){filters.rosterSearch=e.target.value;$('roster-rows').innerHTML=rosterRows();$('roster-count').textContent=filteredMembers().length+' of '+data.members.length+' fictional members';}});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(f==='roster-status'&&isExec()){filters.rosterStatus=e.target.value;$('roster-rows').innerHTML=rosterRows();$('roster-count').textContent=filteredMembers().length+' of '+data.members.length+' fictional members';}if(f==='event'){if(isExec())filters.eventStatus=e.target.value;else filters.eventCategory=e.target.value;$('event-list').innerHTML=eventList();$('event-count').textContent=filteredEvents().length+' event'+(filteredEvents().length===1?'':'s');}});
document.addEventListener('submit',e=>{
 if(e.target.id!=='editor-form')return;e.preventDefault();
 if(['member','event','announcement'].includes(modalType)&&!isExec()){closeModal();toast('Switch to Executive board before making this change.');return;}
 if(modalType==='profile'&&isExec()){closeModal();return;}
 const values=Object.fromEntries(new FormData(e.target));Object.keys(values).forEach(k=>values[k]=values[k].trim());
 if(Object.values(values).some(v=>!v)){$('form-error').textContent='Please complete every field using fictional details.';$('form-error').hidden=false;return;}
 const id=modalId,type=modalType;
 if(type==='member'){
  const existing=data.members.find(m=>m.id===id);if(existing){Object.assign(existing,values);log('Updated fictional member: '+existing.name+'.');}else{data.members.push({id:newId('m'),...values,interests:'',bio:''});log('Added fictional member: '+values.name+'.');}filters.rosterSearch='';filters.rosterStatus='';
 }else if(type==='event'){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(values.date)||isNaN(dateObj(values.date))||!/^\d{2}:\d{2}$/.test(values.time)){$('form-error').textContent='Please choose a valid event date and time.';$('form-error').hidden=false;return;}
  const existing=data.events.find(x=>x.id===id);if(existing)Object.assign(existing,values);else data.events.push({id:newId('e'),...values,rsvps:[]});log((id?'Updated event: ':'Created event: ')+values.title+' ('+values.status.toLowerCase()+').');filters.eventStatus='';
 }else if(type==='announcement'){
  const existing=data.announcements.find(x=>x.id===id);if(existing)Object.assign(existing,values,{date:'2026-10-26',order:Date.now()});else data.announcements.push({id:newId('a'),...values,date:'2026-10-26',order:Date.now()});log((values.status==='Published'?'Published':'Saved draft')+' announcement: '+values.title+'.');
 }else if(type==='profile'){Object.assign(mine(),values);log(mine().name+' updated their demo profile.');}
 closeModal();render();$('main').querySelector('h1')?.focus();toast(type==='event'?`Event ${values.status==='Published'?'published for members':'saved as a draft'}.`:type==='announcement'?`Announcement ${values.status==='Published'?'published for members':'saved as a draft'}.`:type==='profile'?'Demo profile updated.':'Fictional roster updated.');
});
$('modal').addEventListener('close',()=>{if(!$('modal').open){modalType='';modalId='';}});
render();
</script>
